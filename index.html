<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Trainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="trainer-container">
        <h1>Poker Trainer</h1>
        <p>Wybierz wariant gry i wylosuj scenariusz, aby podjąć decyzję.</p>

        <div class="controls">
            <select id="game-variant-select">
                </select>
            <button id="generate-scenario-btn">Losuj Scenariusz</button>
        </div>

        <div id="scenario-display" class="hidden">
            <div class="poker-table">

                <div class="pot-area">
                    Pula: <span id="pot-size"></span>
                </div>

                <div class="player-area opponent">
                    <div class="player-name">Przeciwnik</div>
                    <div class="cards-container">
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                    </div>
                </div>

                <div class="player-area hero">
                    <div class="player-name">Twoje karty</div>
                    <div class="cards-container">
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                        <div class="card-slot"></div>
                    </div>
                </div>
            </div>

            <div class="scenario-info">
                <h2 id="scenario-title"></h2>
                <p id="scenario-description"></p>
                <p><strong>Przebieg akcji:</strong> <span id="action-history"></span></p>
                <p><strong>Twoja decyzja?</strong></p>
                <div id="decision-buttons" class="decision-buttons"></div>
            </div>

            <div id="feedback" class="feedback hidden">
                <p id="feedback-text"></p>
            </div>
        </div>
    </div>

    <script src="scenarios.js"></script>
    <script src="script.js"></script>
</body>
</html>
